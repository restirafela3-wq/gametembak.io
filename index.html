<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050510;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            max-height: 600px;
            background: #000;
            border: 2px solid #333;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none;
        }

        /* Kontrol Khusus HP */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        #dpad button, #btn-shoot {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            touch-action: manipulation;
        }

        #btn-shoot {
            background: rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <span id="score">Skor: 0</span>
        </div>
        <div id="mobile-controls">
            <div id="dpad">
                <button id="btn-left">◄</button>
                <button id="btn-right">►</button>
            </div>
            <button id="btn-shoot">FIRE 🔥</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Ukuran canvas
        canvas.width = 400;
        canvas.height = 600;

        // Variabel Game
        let score = 0;
        let gameOver = false;

        // Player (Pesawat)
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 5,
            dx: 0
        };

        // Array Peluru dan Musuh
        const bullets = [];
        const enemies = [];

        // Kontrol Keyboard
        const keys = {};

        // Event Listener Keyboard (PC)
        document.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (e.key === " " || e.key === "ArrowUp") shoot();
        });
        document.addEventListener("keyup", (e) => keys[e.key] = false);

        // Event Listener Touch (HP)
        const btnLeft = document.getElementById("btn-left");
        const btnRight = document.getElementById("btn-right");
        const btnShoot = document.getElementById("btn-shoot");

        btnLeft.addEventListener("touchstart", (e) => { e.preventDefault(); player.dx = -player.speed; });
        btnLeft.addEventListener("touchend", () => player.dx = 0);

        btnRight.addEventListener("touchstart", (e) => { e.preventDefault(); player.dx = player.speed; });
        btnRight.addEventListener("touchend", () => player.dx = 0);

        btnShoot.addEventListener("touchstart", (e) => { e.preventDefault(); shoot(); });

        // Fungsi Tembak
        function shoot() {
            if (gameOver) return;
            bullets.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 15,
                speed: 7
            });
        }

        // Spawn Musuh secara berkala
        setInterval(() => {
            if (gameOver) return;
            const size = Math.random() * 20 + 20;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: Math.random() * 2 + 1
            });
        }, 1000);

        // Update Game State
        function update() {
            if (gameOver) return;

            // Pergerakan Player Keyboard
            if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;
            
            // Pergerakan Player Touch
            player.x += player.dx;

            // Batas Layar
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Pergerakan Peluru
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Pergerakan Musuh & Tabrakan
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                // Cek tabrakan dengan peluru
                bullets.forEach((b, bIndex) => {
                    if (
                        b.x < enemy.x + enemy.width &&
                        b.x + b.width > enemy.x &&
                        b.y < enemy.y + enemy.height &&
                        b.y + b.height > enemy.y
                    ) {
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        document.getElementById("score").innerText = "Skor: " + score;
                    }
                });

                // Cek tabrakan dengan player
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    gameOver = true;
                    alert("Game Over! Skor Akhir Anda: " + score);
                    location.reload();
                }
            });
        }

        // Render Grafis
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Player (Segitiga Cyan)
            ctx.fillStyle = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Gambar Peluru (Kuning)
            ctx.fillStyle = "#ffff00";
            bullets.forEach((b) => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Gambar Musuh (Merah)
            ctx.fillStyle = "#ff0055";
            enemies.forEach((e) => ctx.fillRect(e.x, e.y, e.width, e.height));
        }

        // Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
